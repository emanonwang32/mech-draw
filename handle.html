<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手柄 · 圆弧连接分步作图｜机械制图动态演示</title>
<style>
 :root{--paper:#fbfaf6;--amber:#d99a2b;--teal:#2f8f83;--dim:#3c4d63;--txt:#22303f;--muted:#6b7b8f}
 *{box-sizing:border-box} html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
 body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(180deg,#eef2f7,#e7edf4);color:var(--txt);min-height:100vh}
 .app{max-width:1320px;margin:0 auto;padding:14px 18px 22px}
 header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
 header h1{font-size:20px;margin:0} header .sub{font-size:13px;color:var(--muted)}
 .main{display:grid;grid-template-columns:minmax(300px,366px) 1fr;gap:16px;align-items:start}
 .card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(24,50,80,.09);padding:13px 15px;min-width:0}
 .col{display:flex;flex-direction:column;gap:12px;min-width:0}
 .steplist{display:flex;flex-direction:column;gap:3px;max-height:clamp(140px,26vh,300px);overflow:auto;padding-right:4px;min-width:0}
 .stepbtn{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;border:1px solid transparent;background:#f6f8fb;border-radius:8px;padding:5px 8px;cursor:pointer;font:inherit;font-size:12.8px;color:#3a4a5e;text-align:left;line-height:1.3}
 .stepbtn:hover{background:#eef4fb;border-color:#cfe0f2}
 .stepbtn .num{font-size:10.5px;color:#93a3b8;text-align:center}
 .stepbtn.active{background:#e8f1fc;border-color:#9dc2e8;color:#123a63;font-weight:600}
 h2.sec{font-size:11.5px;letter-spacing:2.4px;color:#8a9bb0;font-weight:600;margin:0 0 8px}
 .infotitle{display:flex;align-items:center;gap:8px;margin-bottom:7px}
 .badge{background:#123a63;color:#fff;border-radius:7px;font-size:11.5px;padding:2px 7px}
 .body{font-size:13px;line-height:1.72;color:#2d3d4f} .body p{margin:0 0 6px} .body .hi{color:#b03a2e;font-weight:600}
 .keybox{background:#f3f8f5;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12.2px;line-height:1.6;color:#2e4a44}
 .keybox ul{margin:3px 0 0;padding-left:15px}
 .formula{font-family:Cambria,"Times New Roman",serif;background:#f8f5ec;border:1px dashed #ddd2b6;border-radius:8px;padding:5px 10px;font-size:12.6px;color:#6a5320;margin:7px 0 0}
 .stage{padding:8px 10px 10px}
 .svgbox{display:flex;justify-content:center;background:var(--paper);border-radius:10px}
 svg#dw{display:block;height:calc(100vh - 286px);min-height:360px;width:auto;max-width:100%}
 .controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 3px 0}
 button.ctl{font:inherit;font-size:12.6px;border-radius:9px;border:1px solid #cfdae7;background:#fff;color:#2b3d52;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
 button.ctl:hover{background:#f1f6fc}
 button.ctl:disabled{opacity:.42;cursor:default}
 button.ctl.primary{background:#123a63;border-color:#123a63;color:#fff}
 .spacer{flex:1}
 .progress{height:5px;background:#e4ebf3;border-radius:99px;overflow:hidden;margin:2px 4px 6px}
 .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7fb8,#2f8f83);transition:width .45s}
 .chk{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;color:#4a5c72;cursor:pointer}
 .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.6px;color:#5b6b7f;padding:5px 6px 0}
 .legend i{display:inline-block;width:20px;border-top:3px solid #16283f;vertical-align:middle;margin-right:4px}
 .legend i.c{border-top:1.5px dashed #8fb0d6} .legend i.a{border-top:1.5px dashed #d99a2b} .legend i.d{border-top:1.5px solid #3c4d63}
 .hint{font-size:11.8px;color:var(--muted);padding:6px 6px 0;line-height:1.7}
 .dimtable{display:grid;grid-template-columns:1fr 1fr;gap:3px 7px;font-size:11.8px}
 .dimrow{display:flex;gap:5px;padding:2px 4px;border-radius:6px;background:#f7f9fc}
 .dimrow b{color:#123a63;font-family:Cambria,serif;min-width:40px}
 .dimrow span{color:#5b6b7f}
 .center{stroke:#8fb0d6;stroke-width:.5;fill:none;stroke-dasharray:9 2.5 1.2 2.5}
 .aux{stroke:#d99a2b;stroke-width:.42;fill:none;stroke-dasharray:3.2 2.4}
 .sketch{stroke:#2c4058;stroke-width:1.05;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .mark{stroke:#c8412f;stroke-width:.5;fill:none;stroke-linecap:round}
 .ring{stroke:#e0703c;stroke-width:.55;fill:none}
 .dline{stroke:#3c4d63;stroke-width:.42;fill:none;stroke-linecap:round}
 .darrow{fill:#3c4d63}
 .dtext{fill:#202f42;font-family:Cambria,"Times New Roman",serif;font-size:6.4px;text-anchor:middle;dominant-baseline:middle}
 .clabel{fill:#a8452f;font-family:Cambria,serif;font-size:4.6px;dominant-baseline:middle}
 #dw.deep .sketch{stroke-width:1.9;stroke:#08131f}
 @media (max-width:920px){
  .main{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .stage{order:-1} .spacer{display:none}
  .steplist{max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .stepbtn{flex:0 0 auto;font-size:12px;padding:5px 8px}
  svg#dw{height:auto;width:min(100%,calc(58vh*1.9));margin:0 auto}
  .controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .controls button.ctl{width:100%;justify-content:center;padding:8px 4px;font-size:12px}
  header h1{font-size:17px}
 }
 @media (max-width:400px){ .controls{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>

<div class="app">
 <header><h1>手柄 · 圆弧连接分步作图</h1>

     </style>
     <defs>

      <pattern id="g25" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#g5)"/><path d="M50 0H0V50" fill="none" stroke="#e1e9f2" stroke-width=".7"/></pattern>
     </defs>
     <rect x="-34" y="-46" width="200" height="92" fill="url(#g25)"/>
    </svg>
   </div>
   <div class="controls">
    <button class="ctl" id="btnPrev">◀ 上一步</button>
    <button class="ctl primary" id="btnPlay">▶ 播放</button>
    <button class="ctl" id="btnNext">下一步 ▶</button>
    <button class="ctl" id="btnReset">↺ 重来</button>
    <span class="spacer"></span>

    <button class="ctl" id="btnPng">导出 PNG</button>
   </div>
   <div class="legend"><span><i></i>粗实线：轮廓</span><span><i class="c"></i>点画线：中心线</span><span><i class="a"></i>虚线：作图辅助</span><span><i class="d"></i>细实线：尺寸</span></div>
   <div class="hint">键盘 ← / → / 空格 · 点击左侧步骤可跳转</div>
  </div>
 </div>

/* ---- 引擎 ---- */
function animateItem(it,delay,dur){const el=it.el;
 if(it.kind==="fn"){setTimeout(it.fn,delay);return;}
 if(it.kind==="draw"){let L=0;try{L=el.getTotalLength();}catch(e){}
  if(!L){el.style.opacity=1;return;}
  el.style.strokeDasharray=L;el.style.strokeDashoffset=L;
  const a=el.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:Math.max(60,dur),delay,fill:"forwards",easing:"linear"});
  a.onfinish=()=>{el.style.strokeDashoffset=0;if(it.dashed)el.style.strokeDasharray="";};
 }else if(it.kind==="fade"){el.style.opacity=0;el.animate([{opacity:0},{opacity:1}],{duration:Math.max(60,dur),delay,fill:"forwards",easing:"ease-out"});}
 else if(it.kind==="ring"){el.animate([{opacity:.9,r:"1"},{opacity:0,r:"8"}],{duration:1100,delay,iterations:2,easing:"ease-out"});}
}
function settle(it){const el=it.el;
 if(it.kind==="draw"){el.style.strokeDashoffset="";el.style.strokeDasharray="";}
 else if(it.kind==="fade")el.style.opacity=1;
 else if(it.kind==="ring")el.style.opacity=0;
 else if(it.kind==="fn")it.fn();}
function playBag(items){let cursor=0,last=0,end=0;
 items.forEach(it=>{const d=(it.dur||400),start=it.par?last:cursor;last=start;
  if(!it.par)cursor=start+d*0.72;end=Math.max(end,start+d);animateItem(it,start,d);});return end;}
function applyAux(){LY.aux.style.opacity=document.getElementById("showaux").checked?1:0;}
function clearAll(){Object.values(LY).forEach(g=>{while(g.firstChild)g.removeChild(g.firstChild);});
 LY.aux.style.transition="";svg.classList.remove("deep");BAG=[];}
function buildStep(i,anim){BAG=[];STEPS[i-1].build();const items=BAG.slice();if(anim)lastTotal=playBag(items);else items.forEach(settle);}
function gotoStep(n,anim){n=Math.max(1,Math.min(STEPS.length,n));if(n===cur){updateUI();return;}
 if(n<cur||!anim){clearAll();for(let i=1;i<=n;i++)buildStep(i,anim&&i===n);cur=n;}
 else{for(let i=cur+1;i<=n;i++)buildStep(i,anim&&i===n);cur=n;}
 applyAux();updateUI();}
function stop(){playing=false;if(timer){clearTimeout(timer);timer=null;}}
function reset(){stop();clearAll();cur=0;applyAux();updateUI();}
function updateUI(){const list=document.getElementById("steplist");
 [...list.children].forEach((b,i)=>b.classList.toggle("active",i===cur-1));
 const s=cur>=1?STEPS[cur-1]:null;
 document.getElementById("stepno").textContent=s?s.no:"00";
 document.getElementById("steptitle").textContent=s?s.title:"准备";
 document.getElementById("stepbody").innerHTML=s?s.body:"<p>点击「播放」或「下一步」开始。</p>";
 document.getElementById("stepkeys").innerHTML=s&&s.keys.length?"<b>作图要点</b><ul>"+s.keys.map(k=>"<li>"+k+"</li>").join("")+"</ul>":"";
 const f=document.getElementById("stepform");if(s&&s.form){f.style.display="block";f.textContent=s.form;}else f.style.display="none";
 document.getElementById("bar").style.width=(cur/STEPS.length*100)+"%";
 document.getElementById("btnPrev").disabled=cur<=0;document.getElementById("btnNext").disabled=cur>=STEPS.length;
 document.getElementById("btnPlay").textContent=playing?"⏸ 暂停":"▶ 播放";}
function play(){if(playing){stop();updateUI();return;}
 if(cur>=STEPS.length){clearAll();cur=0;updateUI();}
 playing=true;updateUI();
 const tick=()=>{if(!playing)return;if(cur>=STEPS.length){playing=false;updateUI();return;}
  gotoStep(cur+1,true);timer=setTimeout(tick,lastTotal+650);};
 setTimeout(tick,120);}
(function init(){const list=document.getElementById("steplist");
 STEPS.forEach((s,i)=>{const b=document.createElement("button");b.className="stepbtn";
  b.innerHTML=`<span class="num">${s.no}</span><span>${s.title}</span>`;
  b.onclick=()=>{stop();gotoStep(i+1,true);};list.appendChild(b);});
 const tb=document.getElementById("dimtable");
 [["Ø20","杆部直径"],["Ø12","内孔直径"],["22","内孔深"],["38","杆长"],
  ["117","球头圆心位置"],["124","总长"],["R42","颈部圆弧"],["R60","鼓包圆弧"],
  ["Ø30","最高处直径"],["SR7","球头半径"]].forEach(([a,b])=>{
   const d=document.createElement("div");d.className="dimrow";d.innerHTML=`<b>${a}</b><span>${b}</span>`;tb.appendChild(d);});
 document.getElementById("btnPrev").onclick=()=>{stop();gotoStep(cur-1,false);};
 document.getElementById("btnNext").onclick=()=>{stop();gotoStep(cur+1,true);};
 document.getElementById("btnPlay").onclick=play;
 document.getElementById("btnReset").onclick=reset;
 document.getElementById("showaux").onchange=applyAux;
 document.getElementById("btnPng").onclick=()=>{
  const cl=svg.cloneNode(true);cl.setAttribute("width",1400);cl.setAttribute("height",644);
  const s=new XMLSerializer().serializeToString(cl);
  const url=URL.createObjectURL(new Blob([s],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=1400;c.height=644;
   const x=c.getContext("2d");x.fillStyle="#fbfaf6";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
   const a=document.createElement("a");a.download="手柄-第"+cur+"步.png";a.href=c.toDataURL("image/png");a.click();URL.revokeObjectURL(url);};
  img.src=url;};
 document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){stop();gotoStep(cur+1,true);e.preventDefault();}
  else if(e.key==="ArrowLeft"){stop();gotoStep(cur-1,false);e.preventDefault();}
  else if(e.key===" "){play();e.preventDefault();}});
 const q=new URLSearchParams(location.search),st=parseInt(q.get("step")||"0",10);
 if(st>0)gotoStep(Math.min(st,STEPS.length),false);else gotoStep(1,false);
 updateUI();applyAux();
})();
</script>
